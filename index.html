:root{

*{box-sizing:border-box}

.fab button svg{width:22px;height:22px}
.fab button[hidden]{display:none}
.fab button.on{color:#fff;background:var(--me)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:1000;background:var(--bg);border-radius:16px 16px 0 0;box-shadow:0 -2px 12px rgba(0,0,0,.2);padding:8px max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 10px) max(12px,env(safe-area-inset-left,0px))}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 8px;cursor:pointer}
.tabs{display:flex;gap:6px;margin-bottom:6px;overflow-x:auto}
.tab{border:1px solid var(--line);background:var(--chip);color:var(--fg);font:600 13px var(--sans);padding:5px 10px;border-radius:8px;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{border-color:var(--c);box-shadow:inset 0 -3px 0 var(--c)}
.stats{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:4px}
.stats b{font:600 13px var(--mono);color:var(--fg)}
.me{font-size:13px;margin:4px 0 6px;min-height:20px}
.me b{font-family:var(--mono)}
.me .off{color:var(--warn)}
canvas{width:100%;height:96px;display:block;touch-action:none}
.sheet.min .tabs,.sheet.min .stats,.sheet.min canvas{display:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 60px);z-index:1100;background:rgba(20,32,43,.92);color:#fff;font-size:13px;padding:8px 12px;border-radius:8px;max-width:90vw;text-align:center}
.pin{font:700 10px var(--mono);color:#fff;background:var(--c);border:1.5px solid #fff;border-radius:9px;padding:0 4px;box-shadow:0 1px 3px rgba(0,0,0,.4);white-space:nowrap;transform:translate(-50%,-50%);position:absolute}
.flag{font:700 12px var(--sans);color:#fff;background:#14202b;border:2px solid #fff;border-radius:6px;padding:2px 6px;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.4);transform:translate(-50%,-120%);position:absolute}
.peak{font:600 11px var(--sans);color:#14202b;background:#fff;border:2px solid var(--c);border-radius:6px;padding:1px 5px;white-space:nowrap;transform:translate(-50%,-130%);position:absolute}
.medot{width:18px;height:18px;border-radius:50%;background:var(--me);border:3px solid #fff;box-shadow:0 0 0 6px rgba(26,115,232,.25),0 1px 4px rgba(0,0,0,.4);transform:translate(-50%,-50%);position:absolute}
.scrub{width:14px;height:14px;border-radius:50%;background:#fff;border:4px solid var(--c);transform:translate(-50%,-50%);position:absolute;box-shadow:0 1px 4px rgba(0,0,0,.4)}

const R=6371000, rad=d=>d*Math.PI/180;
function hav(a,b,c,d){const x=Math.sin(rad(c-a)/2)**2+Math.cos(rad(a))*Math.cos(rad(c))*Math.sin(rad(d-b)/2)**2;return 2*R*Math.asin(Math.sqrt(x));}
COURSES.forEach(c=>{
  let a=[90,180,-90,-180];
  c.pts.forEach(p=>{a[0]=Math.min(a[0],p[0]);a[1]=Math.min(a[1],p[1]);a[2]=Math.max(a[2],p[0]);a[3]=Math.max(a[3],p[1]);});
  c.bounds=a; c.on=true;
  c.peak=c.pts.reduce((m,p)=>p[2]>m[2]?p:m,c.pts[0]);
  c.kms=[]; let k=1;
  for(let i=1;i<c.pts.length&&k*1000<c.dist*1000-150;i++){
    const p0=c.pts[i-1],p1=c.pts[i];
    while(k*1000<=p1[3]&&k*1000<c.dist*1000-150){const t=(k*1000-p0[3])/((p1[3]-p0[3])||1);c.kms.push([k,p0[0]+(p1[0]-p0[0])*t,p0[1]+(p1[1]-p0[1])*t]);k++;}
  }
});
function nearest(c,lat,lon){ // 코스 위 가장 가까운 점 (같은 길을 두 번 지나는 구간은 후보를 모두 반환)
  const kx=111320*Math.cos(rad(lat)),ky=110540, segs=[]; let bd=1e12;
  for(let i=1;i<c.pts.length;i++){
    const a=c.pts[i-1],b=c.pts[i];
    const ax=(a[1]-lon)*kx,ay=(a[0]-lat)*ky,bx=(b[1]-lon)*kx,by=(b[0]-lat)*ky,dx=bx-ax,dy=by-ay,L=dx*dx+dy*dy;
    const t=L?Math.max(0,Math.min(1,-(ax*dx+ay*dy)/L)):0, d=Math.hypot(ax+t*dx,ay+t*dy);
    segs.push({d,along:a[3]+(b[3]-a[3])*t,ele:a[2]+(b[2]-a[2])*t}); if(d<bd)bd=d;
  }
  const near=segs.filter(s=>s.d<=bd+30).sort((x,y)=>x.along-y.along), cands=[];
  near.forEach(s=>{const l=cands[cands.length-1]; if(l&&s.along-l.lastAlong<400){l.lastAlong=s.along; if(s.d<l.d)Object.assign(l,{d:s.d,along:s.along,ele:s.ele});} else cands.push({...s,lastAlong:s.along});});
  let pick=cands[0];
  if(cands.length>1&&c.prevAlong!=null) pick=cands.reduce((m,x)=>Math.abs(x.along-c.prevAlong)<Math.abs(m.along-c.prevAlong)?x:m);
  else if(cands.length>1) pick=cands.reduce((m,x)=>x.d<m.d?x:m);
  return {d:pick.d,along:pick.along,ele:pick.ele,alts:cands.length>1&&c.prevAlong==null?cands.map(x=>x.along):null};
}
function pointAt(c,dist){
  const p=c.pts; let i=1; while(i<p.length-1&&p[i][3]<dist)i++;
  const a=p[i-1],b=p[i],t=Math.max(0,Math.min(1,(dist-a[3])/((b[3]-a[3])||1)));
  return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
}
const fmtKm=m=>(m/1000).toFixed(m<10000?2:1)+'km';
const fmtM=m=>m<1000?Math.round(m)+'m':(m/1000).toFixed(1)+'km';

/* ===== 지도 어댑터: 네이버 / Leaflet ===== */
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);});}
function loadCss(href){const l=document.createElement('link');l.rel='stylesheet';l.href=href;document.head.appendChild(l);}

function naverAdapter(){
  const N=naver.maps, LL=(a,b)=>new N.LatLng(a,b);
  const c0=COURSES[0].pts[0];
  const map=new N.Map('map',{center:LL(c0[0],c0[1]),zoom:13,mapTypeId:N.MapTypeId.TERRAIN,
    mapTypeControl:false,zoomControl:false,scaleControl:true,logoControlOptions:{position:N.Position.BOTTOM_LEFT}});
  const html=(lat,lon,content,z=10)=>{const m=new N.Marker({position:LL(lat,lon),map,zIndex:z,icon:{content:'<div style="position:relative">'+content+'</div>',anchor:new N.Point(0,0)}});
    return {show:b=>m.setMap(b?map:null),move:(a,b)=>m.setPosition(LL(a,b)),el:()=>m.getElement()};};
  const types=[[N.MapTypeId.TERRAIN,'지형'],[N.MapTypeId.NORMAL,'일반'],[N.MapTypeId.HYBRID,'위성']]; let ti=0;
  const bt=$('btnType'); bt.hidden=false; bt.textContent=types[0][1];
  bt.onclick=()=>{ti=(ti+1)%types.length; map.setMapTypeId(types[ti][0]); bt.textContent=types[ti][1];};
  return {kind:'naver',
    line(pts,color){const path=pts.map(p=>LL(p[0],p[1]));
      const cas=new N.Polyline({map,path,strokeColor:'#ffffff',strokeWeight:8,strokeOpacity:.85,strokeLineCap:'round',strokeLineJoin:'round'});
      const l=new N.Polyline({map,path,strokeColor:color,strokeWeight:4.5,strokeOpacity:.95,strokeLineCap:'round',strokeLineJoin:'round'});
      return {show:b=>{cas.setMap(b?map:null);l.setMap(b?map:null);}};},
    html,
    circle(){const c=new N.Circle({map:null,center:LL(0,0),radius:1,strokeColor:'#1a73e8',strokeOpacity:.5,strokeWeight:1,fillColor:'#1a73e8',fillOpacity:.12});
      return {set:(a,b,r)=>{c.setCenter(LL(a,b));c.setRadius(r);c.setMap(map);}};},
    fit(b){map.fitBounds(new N.LatLngBounds(LL(b[0],b[1]),LL(b[2],b[3])),{top:70,right:70,bottom:240,left:20});},
    pan(a,b){map.panTo(LL(a,b));},
    onUserMove(fn){N.Event.addListener(map,'dragstart',fn);},
    destroy(){map.destroy&&map.destroy();}
  };
}
function leafletAdapter(){
  const c0=COURSES[0].pts[0];
  const map=L.map('map',{zoomControl:false,attributionControl:true}).setView([c0[0],c0[1]],13);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
  L.control.scale({imperial:false,position:'bottomleft'}).addTo(map);
  const html=(lat,lon,content,z=10)=>{const m=L.marker([lat,lon],{zIndexOffset:z*10,interactive:false,icon:L.divIcon({className:'lf-icon',html:'<div style="position:relative">'+content+'</div>',iconSize:[0,0]})}).addTo(map);
    return {show:b=>b?m.addTo(map):m.remove(),move:(a,b)=>m.setLatLng([a,b]),el:()=>m.getElement()};};
  return {kind:'leaflet',
    line(pts,color){const ll=pts.map(p=>[p[0],p[1]]);
      const cas=L.polyline(ll,{color:'#fff',weight:8,opacity:.85}).addTo(map), l=L.polyline(ll,{color,weight:4.5,opacity:.95}).addTo(map);
      return {show:b=>{[cas,l].forEach(x=>b?x.addTo(map):x.remove());}};},
    html,
    circle(){const c=L.circle([0,0],{radius:1,color:'#1a73e8',weight:1,opacity:.5,fillOpacity:.12});return {set:(a,b,r)=>{c.setLatLng([a,b]);c.setRadius(r);c.addTo(map);}};},
    fit(b){map.fitBounds([[b[0],b[1]],[b[2],b[3]]],{paddingTopLeft:[20,70],paddingBottomRight:[70,240]});},
    pan(a,b){map.panTo([a,b]);},
    onUserMove(fn){map.on('dragstart',fn);},
    destroy(){map.remove();}
  };
}

/* ===== 앱 ===== */
let M=null, layers=[], showKm=false, active=COURSES[COURSES.length-1].id, me=null, follow=false, watchId=null, scrubM=null, meM=null, accC=null, wake=null;
const $=id=>document.getElementById(id);
function toast(t,ms=3500){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),ms);}

function build(){
  layers=COURSES.map(c=>{
    const line=M.line(c.pts,c.color);
    const kms=c.kms.map(k=>M.html(k[1],k[2],`<span class="pin" style="--c:${c.color}">${k[0]}</span>`,20));
    const peak=M.html(c.peak[0],c.peak[1],`<span class="peak" style="--c:${c.color}">▲ ${c.peak[2].toLocaleString()}m</span>`,15);
    return {c,line,kms,peak};
  });
  const s=COURSES[0].pts[0];
  M.html(s[0],s[1],'<span class="flag">출발·도착</span>',30);
  accC=M.circle(); meM=null; scrubM=null;
  M.onUserMove(()=>{if(follow){follow=false;$('btnLoc').classList.remove('on');}});
  refresh(); fitVisible();
  if(me) drawMe();
}
function refresh(){
  layers.forEach(L=>{const on=L.c.on;L.line.show(on);L.peak.show(on);L.kms.forEach(k=>k.show(on&&showKm));});
  renderChips(); renderTabs(); renderStats(); drawProfile(); renderMe();
}
function fitVisible(){
  const v=COURSES.filter(c=>c.on); if(!v.length)return;
  const b=v.reduce((a,c)=>[Math.min(a[0],c.bounds[0]),Math.min(a[1],c.bounds[1]),Math.max(a[2],c.bounds[2]),Math.max(a[3],c.bounds[3])],[90,180,-90,-180]);
  M.fit(b);
}
function renderChips(){
  $('chips').innerHTML='';
  COURSES.forEach(c=>{const b=document.createElement('button');b.className='chip';b.style.setProperty('--c',c.color);b.setAttribute('aria-pressed',c.on);
    b.innerHTML=`<i></i>${c.id}<small>${c.dist}km</small>`;
    b.onclick=()=>{c.on=!c.on; if(c.on)active=c.id; else if(active===c.id){const o=COURSES.find(x=>x.on);if(o)active=o.id;} refresh();};
    $('chips').appendChild(b);});
}
function renderTabs(){
  $('tabs').innerHTML='';
  COURSES.filter(c=>c.on).forEach(c=>{const t=document.createElement('button');t.className='tab';t.role='tab';t.style.setProperty('--c',c.color);t.setAttribute('aria-selected',c.id===active);t.textContent=c.id+' 고도';
    t.onclick=()=>{active=c.id;refresh();};$('tabs').appendChild(t);});
}
function cur(){return COURSES.find(c=>c.id===active&&c.on)||COURSES.find(c=>c.on);}
function renderStats(){
  const c=cur(); if(!c){$('stats').innerHTML='코스를 하나 이상 켜줘.';return;}
  $('stats').innerHTML=`<span>거리 <b>${c.dist}km</b></span><span>누적상승 <b>${c.gain.toLocaleString()}m</b></span><span>최고 <b>${c.maxEle.toLocaleString()}m</b></span><span>최저 <b>${c.minEle.toLocaleString()}m</b></span>`;
}

/* 고도 프로파일 + 스크럽 */
function drawProfile(scrubDist){
  const cv=$('prof'), c=cur(), dpr=devicePixelRatio||1, W=cv.clientWidth, H=cv.clientHeight;
  cv.width=W*dpr; cv.height=H*dpr; const g=cv.getContext('2d'); g.scale(dpr,dpr); g.clearRect(0,0,W,H);
  if(!c)return;
  const cs=getComputedStyle(document.documentElement), muted=cs.getPropertyValue('--muted'), line=cs.getPropertyValue('--line');
  const padL=34,padB=16,padT=6, w=W-padL-4, h=H-padB-padT, D=c.dist*1000;
  const lo=Math.floor(c.minEle/100)*100, hi=Math.ceil(c.maxEle/100)*100;
  const X=d=>padL+d/D*w, Y=e=>padT+h-(e-lo)/(hi-lo)*h;
  g.font='10px '+cs.getPropertyValue('--mono'); g.fillStyle=muted; g.strokeStyle=line; g.lineWidth=1;
  const step=(hi-lo)>600?400:200;
  for(let e=lo;e<=hi;e+=step){g.beginPath();g.moveTo(padL,Y(e));g.lineTo(W-4,Y(e));g.stroke();g.fillText(e,2,Y(e)+3);}
  const ks=D>15000?5000:2000;
  for(let d=0;d<=D;d+=ks){g.fillText(d/1000+'k',X(d)-6,H-3);}
  g.beginPath(); c.pts.forEach((p,i)=>i?g.lineTo(X(p[3]),Y(p[2])):g.moveTo(X(p[3]),Y(p[2])));
  g.lineTo(X(D),padT+h); g.lineTo(X(0),padT+h); g.closePath(); g.globalAlpha=.18; g.fillStyle=c.color; g.fill(); g.globalAlpha=1;
  g.beginPath(); c.pts.forEach((p,i)=>i?g.lineTo(X(p[3]),Y(p[2])):g.moveTo(X(p[3]),Y(p[2]))); g.strokeStyle=c.color; g.lineWidth=2; g.stroke();
  if(me){const n=nearest(c,me.lat,me.lon); if(n.d<300){g.fillStyle='#1a73e8';g.beginPath();g.arc(X(n.along),Y(n.ele),5,0,7);g.fill();g.strokeStyle='#fff';g.lineWidth=2;g.stroke();}}
  if(scrubDist!=null){const p=pointAt(c,scrubDist);g.strokeStyle=muted;g.lineWidth=1;g.beginPath();g.moveTo(X(scrubDist),padT);g.lineTo(X(scrubDist),padT+h);g.stroke();
    g.fillStyle=cs.getPropertyValue('--fg');g.font='600 11px '+cs.getPropertyValue('--mono');const t=`${fmtKm(scrubDist)} · ${Math.round(p[2])}m`;const tw=g.measureText(t).width;g.fillText(t,Math.min(Math.max(X(scrubDist)-tw/2,padL),W-tw-4),padT+10);}
}
function scrub(ev){
  const c=cur(); if(!c)return; const r=$('prof').getBoundingClientRect(); const d=Math.max(0,Math.min(1,(ev.clientX-r.left-34)/(r.width-38)))*c.dist*1000;
  const p=pointAt(c,d);
  if(!scrubM) scrubM=M.html(p[0],p[1],`<span class="scrub" style="--c:${c.color}"></span>`,40); else {scrubM.move(p[0],p[1]);scrubM.show(true);}
  const el=scrubM.el&&scrubM.el(); if(el){const s=el.querySelector('.scrub'); if(s)s.style.setProperty('--c',c.color);}
  drawProfile(d);
}
$('prof').addEventListener('pointerdown',e=>{$('prof').setPointerCapture(e.pointerId);scrub(e);});
$('prof').addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')scrub(e);});
$('prof').addEventListener('pointerup',()=>{});

/* 내 위치 */
function renderMe(){
  if(!me)return;
  const rows=COURSES.filter(c=>c.on).map(c=>{const n=nearest(c,me.lat,me.lon);
    if(n.d<300&&!n.alts) c.prevAlong=n.along;
    if(n.d>=300) c.prevAlong=null;
    if(n.d<300&&n.alts) return `<span style="color:${c.color}">●</span> ${c.id} <b>${n.alts.map(fmtKm).join(' 또는 ')}</b> 지점 <span style="color:var(--muted)">(같은 길을 두 번 지나는 구간)</span>`;
    return n.d<300?`<span style="color:${c.color}">●</span> ${c.id} <b>${fmtKm(n.along)}</b> 지점 · 남은 <b>${fmtKm(c.dist*1000-n.along)}</b> <span style="color:var(--muted)">(${Math.round(n.d)}m)</span>`
                  :`<span style="color:${c.color}">●</span> ${c.id} <span class="off">코스에서 ${fmtM(n.d)}</span>`;});
  $('me').innerHTML=rows.join('<br>')+`<br><span style="color:var(--muted);font-size:12px">GPS 정확도 ±${Math.round(me.acc)}m${me.alt!=null?` · 고도 ${Math.round(me.alt)}m`:''}</span>`;
}
function drawMe(){
  if(!meM) meM=M.html(me.lat,me.lon,'<span class="medot"></span>',50); else meM.move(me.lat,me.lon);
  accC.set(me.lat,me.lon,Math.max(me.acc,5));
}
function onPos(p){
  me={lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy,alt:p.coords.altitude};
  drawMe(); if(follow)M.pan(me.lat,me.lon); renderMe(); drawProfile();
}
function onErr(e){
  const m={1:'위치 권한이 꺼져 있어. 브라우저 설정에서 이 사이트의 위치 접근을 허용해줘.',2:'위치를 찾지 못했어. 하늘이 보이는 곳에서 다시 시도해줘.',3:'위치 응답이 늦어. 조금 기다려줘.'};
  toast(m[e.code]||'위치 오류'); if(e.code===1){stopLoc();}
}
function stopLoc(){if(watchId!=null)navigator.geolocation.clearWatch(watchId);watchId=null;follow=false;$('btnLoc').classList.remove('on');}
$('btnLoc').onclick=()=>{
  if(!('geolocation' in navigator)){toast('이 브라우저는 위치를 지원하지 않아.');return;}
  if(location.protocol!=='https:'&&location.hostname!=='localhost'){toast('위치는 https 주소에서만 동작해.');}
  if(watchId==null){watchId=navigator.geolocation.watchPosition(onPos,onErr,{enableHighAccuracy:true,maximumAge:3000,timeout:20000});}
  follow=true;$('btnLoc').classList.add('on'); if(me)M.pan(me.lat,me.lon); else toast('위치 찾는 중…',2000);
};
$('btnFit').onclick=()=>{follow=false;$('btnLoc').classList.remove('on');fitVisible();};
$('btnKm').onclick=()=>{showKm=!showKm;$('btnKm').classList.toggle('on',showKm);refresh();};
$('btnWake').onclick=async()=>{
  try{ if(wake){await wake.release();wake=null;$('btnWake').classList.remove('on');toast('화면 켜두기 끔',1500);}
       else {wake=await navigator.wakeLock.request('screen');$('btnWake').classList.add('on');toast('화면 켜두기 켬',1500);wake.addEventListener('release',()=>{wake=null;$('btnWake').classList.remove('on');});}}
  catch(e){toast('이 브라우저에선 화면 켜두기가 안 돼.');}
};
document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'&&$('btnWake').classList.contains('on')&&!wake){try{wake=await navigator.wakeLock.request('screen');}catch(e){}}});
$('grab').onclick=()=>$('sheet').classList.toggle('min');
function placeFab(){const h=$('sheet').getBoundingClientRect().height;$('fab').style.bottom=(h+12)+'px';}
new ResizeObserver(()=>{placeFab();drawProfile();}).observe($('sheet'));

/* 시작: 네이버 → 실패 시 OSM */
async function useLeaflet(reason){
  if(M&&M.kind==='leaflet')return;
  if(M){try{M.destroy();}catch(e){} $('map').innerHTML='';}
  loadCss('https://unpkg.com/leaflet@1.9.4/dist/leaflet.css');
  await loadScript('https://unpkg.com/leaflet@1.9.4/dist/leaflet.js');
  $('btnType').hidden=true; M=leafletAdapter(); build(); if(reason)toast(reason,5000);
}
window.navermap_authFailure=()=>{useLeaflet('네이버 지도 인증 실패 → 키와 등록한 서비스 URL을 확인해줘. 지금은 OpenStreetMap으로 표시 중.');};
(async()=>{
  if(NAVER_KEY){
    try{await loadScript('https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId='+encodeURIComponent(NAVER_KEY)); M=naverAdapter(); build(); return;}
    catch(e){ await useLeaflet('네이버 지도를 불러오지 못해 OpenStreetMap으로 표시 중.'); return; }
  }
  await useLeaflet('네이버 키가 아직 없어서 OpenStreetMap으로 표시 중.');
})();
</script>
